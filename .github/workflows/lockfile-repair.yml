name: Repair Capacitor 8 Lockfile

on:
  push:
    branches:
      - fix/capacitor8-lockfile
    paths:
      - package.json
      - .github/workflows/lockfile-repair.yml
      - src/data/prophets.ts
      - src/pages/Karbala.tsx
      - src/pages/Prophets.tsx

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/capacitor8-lockfile

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify dependency versions
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');

          const expected = {
            '@capacitor-firebase/authentication': 8,
            'firebase': 12,
            '@capacitor/core': 8
          };

          for (const [name, major] of Object.entries(expected)) {
            const requested =
              (p.dependencies || {})[name] ||
              (p.devDependencies || {})[name];
            const locked = l.packages?.['node_modules/' + name]?.version;

            if (!requested || !locked || Number(locked.split('.')[0]) !== major) {
              console.error(`${name}: requested=${requested}, locked=${locked}`);
              process.exit(1);
            }
            console.log(`${name}: requested ${requested}; locked ${locked}`);
          }
          NODE

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git commit -m "Regenerate lockfile for Capacitor 8"
          git push origin HEAD:refs/heads/fix/capacitor8-lockfile

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
