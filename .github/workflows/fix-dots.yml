name: Fix dot filenames
on: workflow_dispatch

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          cd src/data
          for f in .*.ts; do
            [ -e "$f" ] || continue
            new="${f#.}"
            new="${new#data}"
            mv "$f" "$new"
          done
          cd ../hooks
          for f in .*.ts .*.tsx; do
            [ -e "$f" ] || continue
            new="${f#.}"
            mv "$f" "$new"
          done
          cd ../..

          git add -A
          git commit -m "Remove leading dots and fix garbled filenames"
          git push
