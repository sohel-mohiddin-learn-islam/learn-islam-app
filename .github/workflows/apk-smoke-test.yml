name: APK smoke test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk-latest -R ${{ github.repository }} -p learn-islam.apk -O app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.sohel.learnislam.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > shot.png
            adb logcat -d > log.txt
            echo ===LOG-START===
            grep -n -A28 'FATAL EXCEPTION' log.txt | cut -c1-260 | head -70
            grep -E 'Capacitor|chromium|cr_|WebView|Console' log.txt | cut -c1-260 | head -40
            grep -E 'Process com.sohel.learnislam.app.*(died|has died)|Force finishing|crash' log.txt | cut -c1-200 | head
            echo ===LOG-END===
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            shot.png
            log.txt
